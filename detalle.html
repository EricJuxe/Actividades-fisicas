<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Detalle de Actividad</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="bg-light">
    <div class="container-fluid px-3 px-md-4 py-5 py-md-6">
        <button onclick="history.back()" class="btn btn-dark mb-5 mb-md-6 shadow" style="padding: 0.85rem 1.4rem; font-size: 1.05rem;">← Regresar</button>
        
        <div class="card border-0 rounded-3 shadow-lg p-5 p-md-6">
            <h1 id="detalle-titulo" class="fw-bold mb-4 mb-md-5" style="font-size: clamp(1.8rem, 5.5vw, 2.6rem); letter-spacing: 0.4px;"></h1>
            <p id="detalle-texto" class="text-muted fs-4 fs-md-3 mb-5 mb-md-6" style="white-space: pre-wrap; line-height: 1.9;"></p>
            
            <div id="contenedor-imagenes" class="d-flex flex-column gap-2 gap-md-3 align-items-center">
            </div>
        </div>
    </div>

    <script src="metodos.js"></script>
    <script>window.onload = cargarDetalle;</script>
</body>
</html>
